name: Patch Next.js 16.3.6

on:
  push:
    branches:
      - revamp/orbital-premium-v1
    paths:
      - .github/workflows/patch-next-16-3-6.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout revamp branch
        uses: actions/checkout@v4
        with:
          ref: revamp/orbital-premium-v1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Regenerate package manifest and lockfile
        run: npm install --save-exact next@16.3.6 eslint-config-next@16.3.6

      - name: Commit patched dependency state
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency state already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: patch Next.js to 16.3.6 [skip ci]"
          git push origin HEAD:revamp/orbital-premium-v1
